<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <!-- Total Balance — displayed at the top of the interface -->
    <header class="balance-section">
      <h1 class="section-heading">Total Balance</h1>
      <p class="balance-amount" id="balance">0.00</p>
    </header>

    <!-- Input Form -->
    <section class="form-section">
      <h2 class="section-heading">Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <div class="form-field">
          <label for="item-input">Item Name</label>
          <input
            type="text"
            id="item-input"
            name="item"
            maxlength="100"
            placeholder="e.g. Lunch"
            autocomplete="off"
          />
        </div>

        <div class="form-field">
          <label for="amount-input">Amount</label>
          <input
            type="number"
            id="amount-input"
            name="amount"
            step="0.01"
            min="0.01"
            placeholder="e.g. 12.50"
            autocomplete="off"
          />
        </div>

        <div class="form-field">
          <label for="category-input">Category</label>
          <select id="category-input" name="category">
            <option value="">Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>

        <button type="submit" id="submit-button">Add Transaction</button>
      </form>

      <!-- Validation / error messages populated by the controller -->
      <ul class="form-messages" id="form-messages" aria-live="polite"></ul>
    </section>

    <!-- Transaction List — scrollable container, populated by JS -->
    <section class="list-section">
      <h2 class="section-heading">Transactions</h2>
      <div class="transaction-list" id="transaction-list" role="list"></div>
    </section>

    <!-- Pie Chart — populated by JS (SVG or empty-state message) -->
    <section class="chart-section">
      <h2 class="section-heading">Spending Distribution</h2>
      <div class="chart-container" id="chart"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
