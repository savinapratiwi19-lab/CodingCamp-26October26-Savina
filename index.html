<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <div class="theme-toolbar">
      <button type="button" id="theme-toggle" aria-label="Dark mode" aria-pressed="false">Dark mode</button>
    </div>
    <!-- Total Balance — displayed at the top of the interface -->
    <header class="balance-section">
      <h1 class="section-heading">Total Balance</h1>
      <p class="balance-amount" id="balance">Rp 0,00</p>
      <p id="budget-status" role="status" aria-live="polite"></p>
    </header>

    <section class="budget-section">
      <h2 class="section-heading">Spending Limit</h2>
      <p id="budget-help">Applies to the total of all recorded transactions.</p>
      <form id="budget-form" novalidate>
        <label for="budget-input">Limit (Rp)</label>
        <div class="category-entry">
          <input id="budget-input" name="budget" type="number" min="0.01" max="999999999.99" step="0.01" placeholder="e.g. 1000000" aria-describedby="budget-help budget-message">
          <button type="submit">Set Limit</button>
          <button type="button" id="clear-budget">Remove</button>
        </div>
      </form>
      <p id="budget-message" role="status" aria-live="polite"></p>
    </section>

    <!-- Input Form -->
    <section class="form-section">
      <h2 class="section-heading">Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <div class="form-field">
          <label for="item-input">Item Name</label>
          <input
            type="text"
            id="item-input"
            name="item"
            maxlength="100"
            placeholder="e.g. Lunch"
            autocomplete="off"
          />
        </div>

        <div class="form-field">
          <label for="amount-input">Amount (Rp)</label>
          <input
            type="number"
            id="amount-input"
            name="amount"
            step="0.01"
            min="0.01"
            max="999999999.99"
            placeholder="e.g. 25000"
            autocomplete="off"
          />
        </div>

        <div class="form-field">
          <label for="category-input">Category</label>
          <select id="category-input" name="category">
            <option value="">Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>

        <button type="submit" id="submit-button">Add Transaction</button>
      </form>

      <details class="custom-category">
        <summary>Manage custom categories</summary>
        <form id="category-form" novalidate>
          <label for="new-category-input">Category name</label>
          <div class="category-entry">
            <input id="new-category-input" name="new-category" type="text" maxlength="40" placeholder="e.g. Shopping" autocomplete="off" aria-describedby="category-message">
            <button type="submit">Add Category</button>
          </div>
          <p id="category-message" role="status" aria-live="polite"></p>
        </form>
        <ul id="custom-category-list" aria-label="Custom categories"></ul>
      </details>

      <!-- Validation / error messages populated by the controller -->
      <ul class="form-messages" id="form-messages" aria-live="polite"></ul>
    </section>

    <!-- Transaction List — scrollable container, populated by JS -->
    <section class="list-section">
      <h2 class="section-heading">Transactions</h2>
      <div class="transaction-list" id="transaction-list" role="list"></div>
    </section>

    <!-- Pie Chart — populated by JS (SVG or empty-state message) -->
    <section class="chart-section">
      <h2 class="section-heading">Spending by Category</h2>
      <div class="chart-container" id="chart"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
